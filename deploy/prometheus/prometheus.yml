global:
  scrape_interval: 5s
  evaluation_interval: 10s

rule_files:
  - rules.yml

scrape_configs:
  - job_name: syncforge-api
    static_configs:
      - targets: ["api:8080"]
    metrics_path: /api/v1/metrics

  - job_name: syncforge-engine
    static_configs:
      - targets: ["engine:8081"]
    metrics_path: /metrics
